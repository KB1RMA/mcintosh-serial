name: CI
run-name: Lint, types, tests and built-package acceptance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch breakage from new dependency releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: Pyright (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # Coverage source, branch coverage and the 100% floor are set in
      # pyproject.toml. This only adds the XML report Codecov reads.
      - run: uv run pytest --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  acceptance:
    name: Acceptance tests (built package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv build
      - name: Check the package metadata
        run: uvx twine check dist/*
      # No project, no source tree: only the wheel and the test tools are installed.
      - name: Run the acceptance suite against the wheel
        run: >
          uv run --no-project --isolated
          --with ./dist/*.whl --with pytest==9.0.3 --with pytest-asyncio==1.4.0
          pytest -o addopts="" -p no:cacheprovider tests/acceptance
