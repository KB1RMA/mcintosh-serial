# McIntosh MA5200 integrated amplifier, the unit pictured in McIntosh's RS-232 application note (RX0001).
# Built from that note only; not confirmed here.
id = "ma5200"
name = "McIntosh MA5200"
dialect = "zoned"
status = "untested"
baudrate = 115200
connector = "3.5 mm TRS: tip = TX (from the unit), ring = RX (to the unit), sleeve = ground"
zones = [1]
notes = "Power-on needs the command sent twice, 100 ms apart, when the unit is in standby."

[inputs]
1 = "MC"
2 = "MM"
3 = "CD 1"
4 = "CD 2"
5 = "DVD"
6 = "AUX"
7 = "Server"
8 = "D2A"
9 = "Tuner"

[references]
documents = ["McIntosh Control Interface application note RX0001 (Rob Kikta, 2015)"]
